# Render Blueprint for BarksBuds (free tier)
databases:
  - name: barksbuds-db
    plan: free
    region: virginia
    databaseName: barksbuds
    user: barksbuds
services:
  - type: web
    name: barksbuds
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: barksbuds-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false
