<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarksBuds is waking up</title><meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFF8EA;color:#2a2622;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.card{max-width:420px;padding:32px 24px}
h1{font-size:1.6rem;margin:14px 0 6px}
p{margin:0 0 10px;color:#625a50}
.dog{width:144px;height:auto;animation:trot .5s ease-in-out infinite alternate}
@keyframes trot{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.dog{animation:none}}
.bar{height:6px;border-radius:3px;background:#EADBB9;overflow:hidden;margin:18px auto 0;max-width:260px}
.bar i{display:block;height:100%;width:0;background:#FBB321;transition:width 1s linear}
a{color:#C8201E;font-weight:700}
</style></head><body><main class="card" role="status" aria-live="polite">
<img class="dog" src="/img/jack-run-144.webp" width="155" height="144" alt="">
<h1>BarksBuds is waking up</h1>
<p>Our free server takes a nap when the dog run is quiet. It's stretching now and usually takes under a minute.</p>
<p id="msg">This page refreshes on its own.</p>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<p style="margin-top:18px"><a href="" onclick="location.reload();return false">Try again now</a></p>
</main>
<script>
(function(){var t0=Date.now(),bar=document.getElementById('bar'),msg=document.getElementById('msg');
function tick(){var s=(Date.now()-t0)/1000;bar.style.width=Math.min(95,s/45*100)+'%';
if(s>90)msg.textContent='Still waking up. Thanks for your patience!';}
function poll(){fetch('/healthz',{cache:'no-store'}).then(function(r){if(r.ok){bar.style.width='100%';location.reload();}else{setTimeout(poll,2000);}})
.catch(function(){setTimeout(poll,2000);});}
setInterval(tick,1000);poll();})();
</script></body></html>
